name: Website

on:
  pull_request:
    paths: ['site/**', 'src/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'src/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Redis for isolated archive tests
        run: |
          if ! command -v redis-server; then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
      - name: Compile the Rust block reader for the codec tests
        run: |
          rustc --edition=2021 --crate-type=rlib --crate-name shrunk src/lib.rs -o "$RUNNER_TEMP/libshrunk.rlib"
          rustc --edition=2021 site/demo/codec-oracle.rs --extern shrunk="$RUNNER_TEMP/libshrunk.rlib" -o "$RUNNER_TEMP/codec-oracle"
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm test
        working-directory: site
        env:
          SHRUNK_RUST_ORACLE: ${{ runner.temp }}/codec-oracle
      - run: npm run build
        working-directory: site

  deploy:
    needs: site
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: website-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy site to Vercel production
        working-directory: site
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
