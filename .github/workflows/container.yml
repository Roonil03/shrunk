name: Container

on:
  pull_request:
    paths: ["src/**", "Cargo.*", "service/**", "docs/Container.md", "Dockerfile", ".dockerignore", "compose.yaml", ".github/workflows/container.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and exercise database image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path service/Cargo.toml --check
      - run: cargo clippy --manifest-path service/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path service/Cargo.toml --all-targets --locked
      - run: cargo build --manifest-path service/Cargo.toml --locked
      - run: python3 service/tests/smoke.py --binary service/target/debug/shrunk-server --scenario admission
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shrunk:smoke
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: python3 service/tests/smoke.py --image shrunk:smoke
      - name: Validate Compose configuration
        env:
          SHRUNK_TOKEN: ci-compose-validation-token-at-least-32-characters
        run: docker compose config --quiet

  publish:
    name: Publish tested image to GHCR
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
      - name: Verify registry pull and persisted writes
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          python3 service/tests/smoke.py --image "$IMAGE"
